<!DOCTYPE html>
<html>

<head>
    <title>単語帳アプリ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <h1>📖 単語帳</h1>

    <div class="word-card">

    <h2 id="word">apple</h2>

    <p id="answer" style="display: none;">りんご</p>

    <button id="answerButton">答えを見る</button>

</div>
    <button id="nextButton">次の単語</button>
    <button id="deleteButton">この単語を削除</button>


    <h3>単語を追加</h3>

    <input id="newWord" type="text" placeholder="英単語">
    <input id="newAnswer" type="text" placeholder="日本語">

    <button id="addButton">追加</button>

    <script src="script.js"></script>

</body>

</html>

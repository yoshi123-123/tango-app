<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語帳アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="menu">
    <button id="menuButton" class="menu-button">☰ メニュー</button>

    <div id="menuList" class="menu-list">
        <button>📚 単語帳</button>
        <button id="gameMenuButton">🎮 4択ゲーム</button>
        <button>❓ わからない単語</button>
        <button>📊 学習記録</button>
    </div>
</div>
<div id="wordbookScreen">


    <h1>📖 単語帳</h1>
    <h3>📊 TOEICレベル</h3>

<select id="levelSelect">
    <option value="300">300〜400</option>
    <option value="400">400〜500</option>
    <option value="500">500〜600</option>
    <option value="600">600〜700</option>
    <option value="700">700〜800</option>
    <option value="800">800〜900</option>
</select>

    <div class="word-card">

    <h2 id="word">apple</h2>

    <p id="answer" style="display: none;">りんご</p>

    <button id="answerButton" class="answer-button">答えを見る</button>

</div>
    <button id="nextButton" class="next-button">次の単語</button>
    <button id="unknownButton" class="unknown-button">
    ❓ わからない
</button>
    <button id="deleteButton" class="delete-button">
    この単語を削除
</button>


    <h3 class="add-title">✨ 単語を追加 ✨</h3>

<input id="newWord" type="text" placeholder="英単語">
<input id="newAnswer" type="text" placeholder="日本語">

<select id="newLevel">
    <option value="300">300〜400</option>
    <option value="400">400〜500</option>
    <option value="500">500〜600</option>
    <option value="600">600〜700</option>
    <option value="700">700〜800</option>
    <option value="800">800〜900</option>
</select>

<button id="addButton" class="add-button">追加</button>

    

</body>

<h3 class="add-title">📚 単語を一括登録</h3>

<textarea id="bulkWords"
    placeholder="英単語,日本語,レベル
apple,りんご,300
book,本,300
school,学校,300"></textarea>

<button id="bulkAddButton" class="add-button">
    まとめて登録
</button>
</div>
<!-- 4択ゲーム -->
<!-- 4択ゲーム -->
<div id="quizScreen" class="quiz-screen">

    <h2>🎮 4択ゲーム</h2>

    <p id="quizQuestion">apple</p>

    <button class="quiz-answer"></button>
    <button class="quiz-answer"></button>
    <button class="quiz-answer"></button>
    <button class="quiz-answer"></button>

    <p id="quizScore">⭐ 0ポイント</p>

</div>

<script src="script.js"></script>

</body>
</html>
